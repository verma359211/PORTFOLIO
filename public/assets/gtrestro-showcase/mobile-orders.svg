<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1700" viewBox="0 0 900 1700">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
  </filter>
  <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.24"/>
  </filter>
  <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0E5035"/>
    <stop offset="100%" stop-color="#082F22"/>
  </linearGradient>
  <linearGradient id="screenLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFDF8"/>
    <stop offset="100%" stop-color="#F2EFE8"/>
  </linearGradient>
  
</defs>


