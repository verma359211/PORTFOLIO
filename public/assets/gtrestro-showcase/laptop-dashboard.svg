<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
  </filter>
  <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.24"/>
  </filter>
  <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0E5035"/>
    <stop offset="100%" stop-color="#082F22"/>
  </linearGradient>
  <linearGradient id="screenLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFDF8"/>
    <stop offset="100%" stop-color="#F2EFE8"/>
  </linearGradient>
  
</defs>


<g filter="url(#softShadow)">
  <rect x="240" y="130" rx="34" ry="34" width="1320" height="790" fill="#16181A"/>
  <rect x="286" y="175" rx="20" ry="20" width="1228" height="700" fill="url(#screenLight)"/>
  <rect x="286" y="175" rx="20" ry="20" width="355" height="700" fill="url(#screenGrad)"/>
  <circle cx="900" cy="151" r="8" fill="#3A3A3A"/>
</g>

<!-- sidebar -->
<text x="350" y="245" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F6F8F5">GT Restro</text>
